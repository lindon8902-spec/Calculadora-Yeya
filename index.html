<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Lo del Boli</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fff7e6;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 15px;
    }

    .logo {
      width: 150px;
      display: block;
      margin: 10px auto;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      color: #d35400;
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      color: white;
      cursor: pointer;
    }

    .btn-add { background: #27ae60; }
    .btn-calc { background: #d35400; }
    .btn-export { background: #2980b9; }

    .producto-item {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .producto-resumen {
      font-size: 14px;
      color: #444;
      margin-top: 8px;
      padding: 10px;
      background: #f8f8f8;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .resultado, .auditoria {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    hr {
      border: none;
      border-bottom: 1px solid #ddd;
      margin: 10px 0;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 10px;
    }

    .close-btn {
      background: #c0392b;
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="logo-lo-del-boli.png" class="logo" />

    <h1>Calculadora de Costo y Ganancia</h1>

    <label><strong>Costo total del transporte</strong></label>
    <input type="number" id="transporteTotal" placeholder="Ej: 50000" step="0.01" />

    <button class="btn-add" onclick="abrirModal()">Agregar producto</button>

    <div id="listaProductos"></div>

    <button class="btn-calc" onclick="calcular()">Calcular todo</button>

    <div class="resultado" id="resultado"></div>

    <div class="auditoria" id="auditoria"></div>

    <button class="btn-export" onclick="exportarExcel()">Exportar Excel</button>
    <button class="btn-export" onclick="exportarPDF()">Exportar PDF</button>
    <button class="btn-export" onclick="exportarXLSX()">Exportar XLSX Profesional</button>

  </div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Agregar producto</h3>

    <label>Nombre</label>
    <input type="text" id="nombre">

    <label>Cantidad (libras)</label>
    <input type="number" id="cantidad" step="0.01">

    <label>Precio de compra (por libra)</label>
    <input type="number" id="precioCompra" step="0.01">

    <label>Precio de venta (por libra)</label>
    <input type="number" id="precioVenta" step="0.01">

    <button class="btn-add" id="btnGuardar" onclick="guardarProducto()">Guardar</button>
    <button class="close-btn" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<script>
let productos = [];
let auditoriaData = [];

function abrirModal() {
  document.getElementById("modal").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";

  const btn = document.getElementById("btnGuardar");
  btn.innerText = "Guardar";
  btn.onclick = guardarProducto;
}

function guardarProducto() {
  const nombre = document.getElementById("nombre").value;
  const cantidad = parseFloat(document.getElementById("cantidad").value);
  const precioCompra = parseFloat(document.getElementById("precioCompra").value);
  const precioVenta = parseFloat(document.getElementById("precioVenta").value);

  productos.push({ nombre, cantidad, precioCompra, precioVenta });

  mostrarListaProductos();
  cerrarModal();
}

function mostrarListaProductos() {
  const lista = document.getElementById("listaProductos");
  lista.innerHTML = "";

  productos.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "producto-item";
    div.innerHTML = `<strong>${p.nombre}</strong>`;

    div.onclick = () => {
      const existente = div.querySelector(".producto-resumen");

      if (existente) {
        existente.style.opacity = "0";
        setTimeout(() => existente.remove(), 200);
        return;
      }

      const resumen = document.createElement("div");
      resumen.className = "producto-resumen";

      resumen.innerHTML = `
        ${p.cantidad} lb — $${(p.cantidad * p.precioVenta).toFixed(2)}
        <br><br>

        <button style="padding:6px 10px;border:none;border-radius:6px;background:#d35400;color:white;margin-right:10px;"
          onclick="editarProducto(${index}); event.stopPropagation();">
          ✏ Editar
        </button>

        <button style="padding:6px 10px;border:none;border-radius:6px;background:#c0392b;color:white;"
          onclick="eliminarProducto(${index}); event.stopPropagation();">
          ❌ Eliminar
        </button>
      `;

      div.appendChild(resumen);

      setTimeout(() => resumen.style.opacity = "1", 10);
    };

    lista.appendChild(div);
  });
}

function editarProducto(index) {
  const p = productos[index];

  document.getElementById("nombre").value = p.nombre;
  document.getElementById("cantidad").value = p.cantidad;
  document.getElementById("precioCompra").value = p.precioCompra;
  document.getElementById("precioVenta").value = p.precioVenta;

  abrirModal();

  const btn = document.getElementById("btnGuardar");
  btn.innerText = "Guardar cambios";

  btn.onclick = () => {
    p.nombre = document.getElementById("nombre").value;
    p.cantidad = parseFloat(document.getElementById("cantidad").value);
    p.precioCompra = parseFloat(document.getElementById("precioCompra").value);
    p.precioVenta = parseFloat(document.getElementById("precioVenta").value);

    mostrarListaProductos();
    cerrarModal();
  };
}

function eliminarProducto(index) {
  productos.splice(index, 1);
  mostrarListaProductos();
}

function calcular() {
  let totalGanancia = 0;
  let totalLibras = 0;
  auditoriaData = [];

  const transporteTotal = parseFloat(document.getElementById("transporteTotal").value);

  productos.forEach(p => totalLibras += p.cantidad);

  const transportePorLibra = totalLibras > 0 ? transporteTotal / totalLibras : 0;

  let auditoriaTexto = "";

  productos.forEach(p => {
    const libras = p.cantidad;

    const compraTotal = libras * p.precioCompra;
    const ventaTotal = libras * p.precioVenta;
    const transporteProducto = libras * transportePorLibra;

    const gastoTotal = compraTotal + transporteProducto;
    const gananciaNeta = ventaTotal - gastoTotal;
    const margen = ventaTotal > 0 ? (gananciaNeta / ventaTotal) * 100 : 0;

    totalGanancia += gananciaNeta;

    auditoriaTexto += `
      <p><strong>${p.nombre}</strong></p>
      <p>Libras: ${libras}</p>
      <p>Precio total de compra: $${compraTotal.toFixed(2)}</p>
      <p>Precio total de venta: $${ventaTotal.toFixed(2)}</p>
      <p>Transporte asignado: $${transporteProducto.toFixed(2)}</p>
      <p><strong>Gasto total: $${gastoTotal.toFixed(2)}</strong></p>
      <p>Ganancia: $${gananciaNeta.toFixed(2)}</p>
      <p>Margen: ${margen.toFixed(2)}%</p>
      <hr>
    `;

    auditoriaData.push({
      nombre: p.nombre,
      libras,
      compraTotal: compraTotal.toFixed(2),
      ventaTotal: ventaTotal.toFixed(2),
      transporte: transporteProducto.toFixed(2),
      gastoTotal: gastoTotal.toFixed(2),
      ganancia: gananciaNeta.toFixed(2),
      margen: margen.toFixed(2)
    });
  });

  document.getElementById("resultado").innerHTML = `
    <p><strong>Total productos:</strong> ${productos.length}</p>
    <p><strong>Total libras:</strong> ${totalLibras}</p>
    <p><strong>Transporte por libra:</strong> $${transportePorLibra.toFixed(2)}</p>
    <p><strong>Ganancia total:</strong> $${totalGanancia.toFixed(2)}</p>
  `;

  document.getElementById("auditoria").innerHTML = auditoriaTexto;
}

function exportarExcel() {
  let csv = "Producto,Libras,Compra Total,Venta Total,Transporte,Gasto Total,Ganancia,Margen\n";

  auditoriaData.forEach(p => {
    csv += `${p.nombre},${p.libras},${p.compraTotal},${p.ventaTotal},${p.transporte},${p.gastoTotal},${p.ganancia},${p.margen}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "auditoria_lo_del_boli.csv";
  a.click();
}

function exportarPDF() {
  window.print();
}

function exportarXLSX() {
  const wb = XLSX.utils.book_new();

  const auditoriaSheet = XLSX.utils.json_to_sheet(auditoriaData);
  XLSX.utils.book_append_sheet(wb, auditoriaSheet, "Auditoría");

  XLSX.writeFile(wb, "Auditoria_Lo_Del_Boli.xlsx");
}
</script>

</body>
</html>
